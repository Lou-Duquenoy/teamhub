name: Docker Publish (backend & frontend)

on:
  push:
    branches: [ main, develop, 'release/**' ]
    tags: [ 'v*' ]   # ex: v0.1.0
  pull_request:
    branches: [ main, develop, 'release/**' ]  # build only (no push)

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # nécessaire pour pousser sur GHCR
    env:
      # sera défini à l'étape "Lowercase owner"
      OWNER_LC: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ⚠️ GHCR veut tout en minuscules
      - name: Lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Set up QEMU (optional multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------- BACKEND ----------
      - name: Backend — Docker metadata
        id: meta_back
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER_LC }}/teamhub-backend
          tags: |
            type=ref,event=branch                         # :main, :develop, :release-0.1.0
            type=ref,event=branch,pattern=release-{{branch}}
            type=sha,format=short                         # :sha-abcdef0
            type=semver,pattern={{version}}               # :v0.1.0 (si tag v*)
            type=semver,pattern=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Backend — Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/backend.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta_back.outputs.tags }}
          labels: ${{ steps.meta_back.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ env.OWNER_LC }}/teamhub-backend:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.OWNER_LC }}/teamhub-backend:buildcache,mode=max
          # platforms: linux/amd64,linux/arm64

      # ---------- FRONTEND ----------
      - name: Frontend — Docker metadata
        id: meta_front
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER_LC }}/teamhub-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=branch,pattern=release-{{branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Frontend — Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/frontend.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta_front.outputs.tags }}
          labels: ${{ steps.meta_front.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ env.OWNER_LC }}/teamhub-frontend:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.OWNER_LC }}/teamhub-frontend:buildcache,mode=max
          build-args: |
            VITE_API_BASE_URL=https://example-backend.dev
          # platforms: linux/amd64,linux/arm64
